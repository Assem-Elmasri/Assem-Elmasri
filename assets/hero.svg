1.5">Software engineer</text><text x="450" y="292" text-anchor="middle" fill="#ffffff"><tspan class="s" font-size="58" letter-spacing="-1.5">for </tspan><tspan class="i" font-size="68" letter-spacing="-1">useful things</tspan><tspan class="s" font-size="58">.</tspan></text><text x="450" y="346" class="b" font-size="16" fill="#8a8f98" text-anchor="middle">I build full-stack products in TypeScript and JavaScript,</text><text x="450" y="373" class="b" font-size="16" fill="#8a8f98" text-anchor="middle">dig into systems code with Rust and C,</text><text x="450" y="400" class="b" font-size="16" fill="#8a8f98" text-anchor="middle">and share the work in public.</text><line x1="0" y1="429.5" x2="900" y2="429.5" stroke="#23252b"/></svg>